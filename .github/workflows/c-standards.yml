name: C standards - C99 and C23

# The code base is C99 (old compilers on Solaris, AIX and the BSDs must
# still build it) and must also build as C23, the default of GCC 15.
# Both builds fail on old-style (K&R) definitions and declarations
# without prototypes, which C23 no longer accepts.  The bundled ksh93
# (third-party, with its own feature probes) is not checked.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c-standards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.std }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - std: gnu99
            cc: gcc-14
          - std: gnu23
            cc: gcc-14

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            autoconf automake bison build-essential flex g++ gcc-14 ksh \
            libcrypt-dev libdbus-1-dev libfreetype6-dev libjpeg-dev \
            liblmdb-dev libmotif-dev libpam0g-dev libpng-dev libssl-dev \
            libtirpc-dev libtool libutempter-dev libx11-dev libxaw7-dev \
            libxft-dev libxinerama-dev libxmu-dev libxpm-dev libxrandr-dev \
            libxrender-dev libxss-dev libxt-dev locales m4 ncompress opensp \
            patch python3 tcl-dev x11-session-utils x11-xserver-utils \
            x11proto-fonts-dev xbitmaps xfonts-utils
          sudo locale-gen en_US.UTF-8

      - name: Configure (-std=${{ matrix.std }})
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          set -Eeuo pipefail
          cd cde
          ./autogen.sh
          ./configure CC="${{ matrix.cc }} -std=${{ matrix.std }}" \
            CFLAGS="-g -O1 -Wold-style-definition -Wstrict-prototypes"

      - name: Build
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          set -Eeuo pipefail
          cd cde
          make -j"$(nproc)" 2>&1 | tee "$RUNNER_TEMP/make.log"

      - name: No old-style C outside ksh93
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -E '\[-W(old-style-definition|strict-prototypes)\]' \
              "$RUNNER_TEMP/make.log" |
            grep -v '/ksh93/' |
            grep -Ev '^([^/: ]*/)?[0-9.]+\.c:' |   # ksh93 feature probes
            sort -u > "$RUNNER_TEMP/old-style.txt" || true
          n=$(wc -l < "$RUNNER_TEMP/old-style.txt")
          {
            echo "## -std=${{ matrix.std }}"
            echo
            echo "Old-style definitions / declarations without prototypes: **$n**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -ne 0 ]; then
            cat "$RUNNER_TEMP/old-style.txt"
            exit 1
          fi
