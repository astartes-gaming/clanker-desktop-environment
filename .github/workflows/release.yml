name: Release - packages for many architectures

# Builds the release packages and publishes them as a GitHub release:
#   .deb  (Debian 13)  amd64 arm64 ppc64el s390x riscv64 i386 armhf armel
#   .tar.gz            the same files, for other distributions
#   .rpm  (Fedora)     x86_64 aarch64
#   source tarball
# Pushing a tag "vX.Y.Z.W" builds and publishes that version.  Running it
# by hand builds a version without publishing (unless asked to).
# amd64/i386 and arm64/aarch64 build natively; the rest run under QEMU
# (slow, hence the long timeouts).  CDE's build runs programs it has
# just built, so it is not cross-compiled.

on:
  push:
    tags: ["v*"]
  # a pull request changing the release builds them (never publishes)
  pull_request:
    paths:
      - ".github/release/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.0.0.1)"
        required: true
        default: "0.0.0.1"
      publish:
        description: "Publish a GitHub release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${REF_NAME#v}"; else v="${INPUT:-0.0.0.1}"; fi
          case "$v" in *[!0-9.]*|"") echo "bad version: $v" >&2; exit 1 ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

  deb:
    name: deb ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.emulated && 350 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64,   runner: ubuntu-24.04,     platform: linux/amd64,    emulated: false }
          - { arch: i386,    runner: ubuntu-24.04,     platform: linux/386,      emulated: false }
          - { arch: arm64,   runner: ubuntu-24.04-arm, platform: linux/arm64,    emulated: false }
          - { arch: armhf,   runner: ubuntu-24.04,     platform: linux/arm/v7,   emulated: true }
          - { arch: armel,   runner: ubuntu-24.04,     platform: linux/arm/v5,   emulated: true }
          - { arch: ppc64el, runner: ubuntu-24.04,     platform: linux/ppc64le,  emulated: true }
          - { arch: s390x,   runner: ubuntu-24.04,     platform: linux/s390x,    emulated: true }
          - { arch: riscv64, runner: ubuntu-24.04,     platform: linux/riscv64,  emulated: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: QEMU
        if: matrix.emulated
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Build in Debian 13 (${{ matrix.platform }})
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/src" debian:13 \
            bash /src/.github/release/build-deb.sh "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-${{ matrix.arch }}
          path: out/

  rpm:
    name: rpm ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build in Fedora
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/src" fedora:43 \
            bash /src/.github/release/build-rpm.sh "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm-${{ matrix.arch }}
          path: out/

  source:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p out
          git archive --format=tar.gz --prefix="clanker-cde-$VERSION/" \
            -o "out/clanker-cde-$VERSION-source.tar.gz" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          path: out/

  release:
    name: Publish
    needs: [version, deb, rpm, source]
    # publish what built, even if an emulated architecture failed
    if: always() && needs.version.result == 'success' && (github.ref_type == 'tag' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -la
          sha256sum * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<EOF
          Clanker Desktop Environment $VERSION, an early preview release.

          - Debian, Ubuntu and derivatives: \`sudo apt install ./cde-desktop_${VERSION}-1_<arch>.deb\`
          - Fedora and other RPM systems: \`sudo dnf install ./clanker-cde-${VERSION}-1.<dist>.<arch>.rpm\`
          - Others: unpack \`clanker-cde-${VERSION}-linux-<arch>.tar.gz\` at /
          - Build it yourself: \`clanker-cde-${VERSION}-source.tar.gz\`

          Architectures: amd64/x86_64, arm64/aarch64, ppc64el, s390x, riscv64,
          and the older i386, armhf (ARMv7) and armel (ARMv5); a package is
          missing here only if its emulated build did not finish.
          Check downloads against SHA256SUMS.
          EOF
          gh release create "v$VERSION" dist/* --repo "$REPO" --target "$SHA" \
            --title "Clanker CDE $VERSION" --notes-file notes.md --prerelease
